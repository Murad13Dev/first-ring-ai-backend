version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: first-ring-ai-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: first_ring_ai
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - first-ring-network

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: first-ring-ai-redis
    restart: always
    ports:
      - '6379:6379'
    networks:
      - first-ring-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: first-ring-ai-backend
    restart: always
    ports:
      - '5000:5000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/first_ring_ai?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - first-ring-network
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads

volumes:
  postgres_data:

networks:
  first-ring-network:
    driver: bridge
